name: vmpc
description: >-
  DartVMP compiler: compiles a restricted subset of Dart into the private
  instruction set executed by the `dartvmp` native interpreter.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  args: ^2.5.0
  # SHA-256 for the image/name keystream. Already in the local pub cache, so this
  # does not need network access to resolve.
  crypto: ^3.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
