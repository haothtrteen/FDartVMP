# C-layer virtualization hand-off: builds the declared targets as real functions
# (noinline + used + no_stack_protector, see packages/dartvmp/src/dvmp_vmpacker.h) so
# VMPacker can find them. On its own this changes nothing an attacker can use - the
# targets stay local symbols and the export surface is pinned by vmp_exports.map. It is
# ON here because tool/apply_vmpacker.ps1 needs it and the protection step runs after
# the build:
#
#   flutter build apk --release            # -> CMake output with findable targets
#   tool/apply_vmpacker.ps1 -InputSo build/unstripped/libdartvmp.unstripped.arm64-v8a.so `
#       -OutputSo build/libdartvmp.vmpprotected.so
#   tool/repack_apk.ps1 -Apk <apk> -Replace lib/arm64-v8a/libdartvmp.so=<protected.so> -Out out.apk
#   tool/verify_device_run.ps1 -Apk out.apk   # installs and runs it - the gate that
#                                             # catches a mistranslated function
#
# Without the middle steps the APK is simply a normal, un-virtualized build. With them,
# read tool/vmpacker_targets.txt first: it lists which functions are usable on a device
# and which crash it, with the measurement behind each.
dvmp.vmpacker=true

# NOT SET: dvmp.vmpacker.novector=true. It de-vectorises dvmp_sha256.c and
# dvmp_module.c so VMPacker can translate the byte-copy loops in dvmp_mask_keystream and
# code_store_build. Both are in the `#+pcrel` section of tool/vmpacker_targets.txt now,
# because they contain calls and crash on a device, so paying for the de-vectorisation
# would buy nothing. Re-enable it together with -PcRel if VMPacker learns to resolve a
# call.
